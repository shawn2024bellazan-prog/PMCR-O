name: Portability validation

on:
  push:
    branches:
      - fix/playwright-service-defaults-path
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-build:
    name: .NET 10 build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        run: dotnet restore ProjectName.Template.slnx
      - name: Build solution
        run: dotnet build ProjectName.Template.slnx --configuration Release --no-restore
      - name: Verify skills copied to Orchestration API output
        shell: pwsh
        run: |
          $skills = Join-Path $PWD "src/ProjectName.OrchestrationApi/bin/Release/net10.0/skills"
          if (-not (Test-Path $skills -PathType Container)) {
            throw "Expected skills output directory was not created: $skills"
          }
          $files = Get-ChildItem $skills -File -Recurse
          if ($files.Count -eq 0) {
            throw "Skills output directory is empty: $skills"
          }
          Write-Host "Verified $($files.Count) copied skill files."

  playwright-container-build:
    name: Playwright MCP container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Playwright MCP image
        run: |
          docker build --progress=plain \
            --file src/Mcps/ProjectName.Mcp.Playwright/Dockerfile \
            --tag pmcro-playwright-mcp:ci .
          docker run --rm --entrypoint dotnet pmcro-playwright-mcp:ci --list-runtimes
      - name: Launch Chromium smoke test
        run: |
          docker run --rm --entrypoint /bin/bash pmcro-playwright-mcp:ci -lc '
            chrome="$(find /ms-playwright /root/.cache/ms-playwright -type f -name chrome -perm -u+x -print -quit 2>/dev/null)"
            test -n "$chrome"
            "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom about:blank | grep -q "<html"
          '
      - name: Start Playwright MCP and verify HTTP readiness
        run: |
          docker run --detach --name pmcro-playwright-smoke -p 18080:8080 pmcro-playwright-mcp:ci
          trap 'docker rm -f pmcro-playwright-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/ >/tmp/pmcro-playwright-root.txt; then
              break
            fi
            sleep 1
          done
          grep -q "Browser Automation Actuator Online" /tmp/pmcro-playwright-root.txt
          curl --fail --silent http://127.0.0.1:18080/health >/dev/null
